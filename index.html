<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🎡 Baraban — Stars Fortuna</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070913;
    --surface: #111629;
    --surface-2: #18203c;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: rgba(148, 163, 184, 0.16);
    --neon-a: #7c3aed;
    --neon-b: #06b6d4;
    --neon-c: #f59e0b;
    --neon-d: #ec4899;
    --success: #10b981;
    --danger: #ef4444;
    --pointer: #fde047;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    line-height: 1.45;
  }

  body {
    padding-top: calc(12px + var(--safe-top));
    padding-bottom: calc(28px + var(--safe-bottom));
    background-image:
      radial-gradient(circle at 15% 0%, rgba(124, 58, 237, 0.22), transparent 48%),
      radial-gradient(circle at 88% 12%, rgba(6, 182, 212, 0.18), transparent 46%),
      radial-gradient(circle at 50% 100%, rgba(236, 72, 153, 0.12), transparent 55%);
  }

  .container {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .user-name {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .balance-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(124, 58, 237, 0.24));
    border: 1px solid rgba(251, 191, 36, 0.45);
    color: #fde68a;
    font-weight: 800;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    box-shadow: 0 0 18px rgba(245, 158, 11, 0.18);
  }

  /* Wheel Section */
  .wheel-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 8px 10px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(17, 22, 41, 0.92), rgba(11, 15, 29, 0.96));
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  }

  .pointer {
    position: relative;
    z-index: 15;
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 28px solid var(--pointer);
    filter: drop-shadow(0 4px 10px rgba(253, 224, 71, 0.65));
    margin-bottom: -10px;
  }

  .wheel-frame {
    position: relative;
    width: min(90vw, 380px);
    height: min(90vw, 380px);
    border-radius: 50%;
    padding: 12px;
    background: radial-gradient(circle, #1e293b 62%, #0f172a 100%);
    border: 2px solid rgba(168, 85, 247, 0.55);
    box-shadow:
      0 0 28px rgba(124, 58, 237, 0.35),
      0 0 55px rgba(6, 182, 212, 0.18),
      inset 0 0 20px rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wheel-frame.spinning {
    box-shadow:
      0 0 38px rgba(236, 72, 153, 0.55),
      0 0 70px rgba(6, 182, 212, 0.35),
      inset 0 0 24px rgba(0, 0, 0, 0.75);
  }

  .bulb {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fef08a;
    box-shadow: 0 0 8px #fde047;
    transform: translate(-50%, -50%);
    z-index: 6;
    opacity: 0.55;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .wheel-frame.spinning .bulb.lit {
    opacity: 1;
    background: #ffffff;
    box-shadow: 0 0 12px #ffffff, 0 0 20px var(--pointer);
    transform: translate(-50%, -50%) scale(1.25);
  }

  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    transform: rotate(0deg);
    will-change: transform;
  }

  .center-spin {
    position: absolute;
    z-index: 12;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.85);
    background: linear-gradient(145deg, #fbbf24, #ec4899 55%, #7c3aed);
    color: #ffffff;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6), 0 0 18px rgba(236, 72, 153, 0.45);
    transition: transform 0.14s ease, opacity 0.2s ease;
  }

  .center-spin:active:not(:disabled) {
    transform: scale(0.92);
  }

  .center-spin:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  /* Main Action Button */
  .spin-cta {
    width: 100%;
    padding: 16px 20px;
    border-radius: 18px;
    border: none;
    background: linear-gradient(135deg, #7c3aed 0%, #ec4899 52%, #06b6d4 100%);
    color: #ffffff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(124, 58, 237, 0.42);
    transition: transform 0.14s ease, opacity 0.2s ease, filter 0.2s ease;
    font-variant-numeric: tabular-nums;
  }

  .spin-cta:active:not(:disabled) {
    transform: scale(0.98);
  }

  .spin-cta:disabled {
    cursor: not-allowed;
    opacity: 0.65;
    filter: grayscale(0.25);
    box-shadow: none;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
  }

  .pending-card {
    border-color: rgba(16, 185, 129, 0.45);
    background: linear-gradient(165deg, rgba(16, 185, 129, 0.12), var(--surface) 45%);
  }

  .pending-title {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .pending-sub {
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .progress-wrap {
    margin: 10px 0 14px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }

  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--neon-b), var(--neon-a), var(--success));
    transition: width 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .btn {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    color: var(--text);
    background: var(--surface-2);
    transition: transform 0.14s ease, opacity 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--neon-a), var(--neon-b));
    border: none;
    color: #fff;
  }

  .btn-claim-ready {
    background: linear-gradient(135deg, #059669, #10b981);
    border: none;
    color: #ffffff;
    box-shadow: 0 0 22px rgba(16, 185, 129, 0.5);
    animation: pulseReady 1.5s infinite ease-in-out;
  }

  @keyframes pulseReady {
    0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(16, 185, 129, 0.45); }
    50% { transform: scale(1.02); box-shadow: 0 0 28px rgba(16, 185, 129, 0.8); }
  }

  /* Prizes Table */
  .section-heading {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .prizes-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .prize-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .withdraw-note {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: 50%;
    transform: translate(-50%, -150%);
    z-index: 120;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
    transition: transform 0.25s ease;
    max-width: calc(100vw - 28px);
    text-align: center;
  }

  .toast.show {
    transform: translate(-50%, 0);
  }

  /* Modal & Confetti */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(3, 6, 15, 0.78);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 390px;
    background: var(--surface);
    border: 1px solid rgba(251, 191, 36, 0.45);
    border-radius: 24px;
    padding: 22px 18px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    position: relative;
    z-index: 102;
  }

  .modal-title {
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 8px;
  }

  .modal-text {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 101;
  }

  /* Center status screen (browser gate / network error) */
  .center-card {
    margin-top: 28px;
    text-align: center;
    padding: 26px 18px;
    border-radius: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .center-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .center-desc {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .skeleton {
    height: 120px;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: skel 1.2s infinite linear;
  }

  @keyframes skel {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div id="toast" class="toast"></div>

<div id="gateScreen" class="container hidden">
  <div class="center-card">
    <div id="gateTitle" class="center-title"></div>
    <div id="gateDesc" class="center-desc"></div>
    <button id="gateBtn" type="button" class="btn btn-primary hidden"></button>
  </div>
</div>

<main id="mainApp" class="container hidden">
  <!-- 1. Header -->
  <header class="header">
    <div id="userNameEl" class="user-name">Foydalanuvchi</div>
    <div class="balance-chip">
      <span>⭐</span>
      <span id="balanceValEl">0</span>
    </div>
  </header>

  <!-- Subscribe warning box (shown when server returns subscribe error) -->
  <section id="subscribeCard" class="card hidden">
    <div id="subscribeTitle" class="section-heading">Kanallarga obuna bo‘ling</div>
    <div id="subscribeLinks" style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;"></div>
    <button id="checkSubBtn" type="button" class="btn btn-primary" style="width:100%;">Tekshirish</button>
  </section>

  <!-- 2. Wheel -->
  <section class="wheel-stage">
    <div class="pointer" aria-hidden="true"></div>
    <div id="wheelFrame" class="wheel-frame">
      <div id="bulbsLayer"></div>
      <canvas id="wheelCanvas" width="760" height="760"></canvas>
      <button id="centerSpinBtn" type="button" class="center-spin">SPIN</button>
    </div>
  </section>

  <!-- 3. Main Spin CTA -->
  <button id="mainSpinBtn" type="button" class="spin-cta">🎡 AYLANTIRISH</button>

  <!-- 4. Pending Prize Card -->
  <section id="pendingCard" class="card pending-card hidden">
    <div id="pendingTitleEl" class="pending-title"></div>
    <div id="pendingSubEl" class="pending-sub"></div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressTextEl">0 / 0</span>
        <span id="progressPctEl">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressFillEl" class="progress-fill"></div>
      </div>
    </div>
    <div class="btn-grid" style="margin-bottom:10px;">
      <button id="inviteBtn" type="button" class="btn btn-primary">📤 Do‘st taklif qilish</button>
      <button id="copyRefBtn" type="button" class="btn">📋 Havolani nusxalash</button>
    </div>
    <div class="btn-grid">
      <button id="claimBtn" type="button" class="btn btn-claim-ready" disabled>✅ Sovrinni olish</button>
      <button id="refreshBtn" type="button" class="btn">🔄 Yangilash</button>
    </div>
  </section>

  <!-- 5. Prizes Table -->
  <section class="card">
    <div class="section-heading">Sovrinlar va shartlar</div>
    <div id="prizesGrid" class="prizes-grid"></div>
  </section>

  <!-- 6. Withdraw Footer -->
  <section class="card" style="padding:14px;">
    <button id="withdrawBtn" type="button" class="btn" style="width:100%;">💸 Stars yechish</button>
    <div id="withdrawNoteEl" class="withdraw-note"></div>
  </section>
</main>

<div id="loadingSkeleton" class="container">
  <div class="skeleton"></div>
  <div class="skeleton" style="height:280px;"></div>
  <div class="skeleton" style="height:54px;"></div>
</div>

<!-- Prize Won Modal -->
<div id="winModal" class="modal-backdrop">
  <div class="modal-box">
    <div id="winModalTitle" class="modal-title"></div>
    <div id="winModalText" class="modal-text"></div>
    <button id="winModalClose" type="button" class="btn btn-primary" style="width:100%;">Davom etish</button>
  </div>
</div>

<script>
(() => {
  // ===== 1. KONFIGURATSIYA VA RANGLAR PALITRASI =====
  const API_BASE = ""; // Default "" — shu domen. Kerak bo'lsa "/api" emas, faqat base URL qo'ying.

  const PALETTE = {
    bg: "#070913",
    surface: "#111629",
    surface2: "#18203c",
    text: "#f8fafc",
    muted: "#94a3b8",
    pointer: "#fde047",
    sectors: [
      ["#6d28d9", "#4c1d95"],
      ["#0891b2", "#164e63"],
      ["#db2777", "#831843"],
      ["#d97706", "#78350f"],
      ["#2563eb", "#1e3a8a"],
      ["#059669", "#064e3b"],
      ["#7c3aed", "#312e81"],
      ["#e11d48", "#881337"]
    ]
  };

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      applyTelegramTheme();
    } catch (_) {}
  }

  function applyTelegramTheme() {
    if (!tg) return;
    const tp = tg.themeParams || {};
    const isLight = tg.colorScheme === "light";
    if (tp.bg_color) document.documentElement.style.setProperty("--bg", tp.bg_color);
    else if (isLight) document.documentElement.style.setProperty("--bg", "#f1f5f9");

    if (tp.secondary_bg_color) document.documentElement.style.setProperty("--surface", tp.secondary_bg_color);
    else if (isLight) document.documentElement.style.setProperty("--surface", "#ffffff");

    if (tp.text_color) document.documentElement.style.setProperty("--text", tp.text_color);
    else if (isLight) document.documentElement.style.setProperty("--text", "#0f172a");

    if (tp.hint_color) document.documentElement.style.setProperty("--muted", tp.hint_color);
    else if (isLight) document.documentElement.style.setProperty("--muted", "#475569");
  }

  // ===== 2. HOLAT VA DOM ELEMENTLAR =====
  const state = {
    balance: 0,
    referred: 0,
    prizes: [],
    pending: null,
    next_in: 0,
    can_spin: false,
    min_withdraw: 0,
    ref_link: "",
    bot_username: "",
    spinning: false,
    busy: false,
    rotation: 0,
    lastTickSector: null
  };

  let countdownTimer = null;
  let pollTimer = null;
  let bulbTimer = null;
  let displayedBalance = 0;
  let balanceAnimRaf = null;

  const gateScreen = document.getElementById("gateScreen");
  const gateTitle = document.getElementById("gateTitle");
  const gateDesc = document.getElementById("gateDesc");
  const gateBtn = document.getElementById("gateBtn");
  const mainApp = document.getElementById("mainApp");
  const loadingSkeleton = document.getElementById("loadingSkeleton");

  const userNameEl = document.getElementById("userNameEl");
  const balanceValEl = document.getElementById("balanceValEl");
  const subscribeCard = document.getElementById("subscribeCard");
  const subscribeLinks = document.getElementById("subscribeLinks");
  const checkSubBtn = document.getElementById("checkSubBtn");

  const wheelFrame = document.getElementById("wheelFrame");
  const bulbsLayer = document.getElementById("bulbsLayer");
  const wheelCanvas = document.getElementById("wheelCanvas");
  const centerSpinBtn = document.getElementById("centerSpinBtn");
  const mainSpinBtn = document.getElementById("mainSpinBtn");

  const pendingCard = document.getElementById("pendingCard");
  const pendingTitleEl = document.getElementById("pendingTitleEl");
  const pendingSubEl = document.getElementById("pendingSubEl");
  const progressTextEl = document.getElementById("progressTextEl");
  const progressPctEl = document.getElementById("progressPctEl");
  const progressFillEl = document.getElementById("progressFillEl");
  const inviteBtn = document.getElementById("inviteBtn");
  const copyRefBtn = document.getElementById("copyRefBtn");
  const claimBtn = document.getElementById("claimBtn");
  const refreshBtn = document.getElementById("refreshBtn");

  const prizesGrid = document.getElementById("prizesGrid");
  const withdrawBtn = document.getElementById("withdrawBtn");
  const withdrawNoteEl = document.getElementById("withdrawNoteEl");

  const winModal = document.getElementById("winModal");
  const winModalTitle = document.getElementById("winModalTitle");
  const winModalText = document.getElementById("winModalText");
  const winModalClose = document.getElementById("winModalClose");
  const confettiCanvas = document.getElementById("confettiCanvas");

  // ===== 3. YORDAMCHI FUNKSIYALAR =====
  let toastTimeout = null;
  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = String(msg || "");
    toast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function hapticImpact(style = "light") {
    try {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
    } catch (_) {}
  }

  function hapticNotify(type = "success") {
    try {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
    } catch (_) {}
  }

  function formatStarNum(val) {
    const n = Number(val) || 0;
    return Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
  }

  function formatHMS(totalSec) {
    const s = Math.max(0, Math.floor(Number(totalSec) || 0));
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    return `${h}:${m}:${sec}`;
  }

  function animateBalanceTo(target) {
    const endVal = Number(target) || 0;
    const startVal = displayedBalance;
    if (startVal === endVal) {
      balanceValEl.textContent = formatStarNum(endVal);
      return;
    }
    if (balanceAnimRaf) cancelAnimationFrame(balanceAnimRaf);
    const duration = 650;
    const t0 = performance.now();
    function step(now) {
      const p = Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const cur = startVal + (endVal - startVal) * eased;
      balanceValEl.textContent = formatStarNum(p >= 1 ? endVal : cur);
      if (p < 1) {
        balanceAnimRaf = requestAnimationFrame(step);
      } else {
        displayedBalance = endVal;
      }
    }
    balanceAnimRaf = requestAnimationFrame(step);
  }

  async function postApi(endpoint) {
    const initData = tg && tg.initData ? tg.initData : "";
    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Init-Data": initData
      },
      body: JSON.stringify({})
    });
    let data = null;
    try {
      data = await res.json();
    } catch (_) {
      data = { ok: false, error: "bad_json", message: "Server javobini o‘qib bo‘lmadi" };
    }
    if (!res.ok || !data || data.ok === false) {
      const err = new Error((data && data.message) || "Xatolik yuz berdi");
      err.code = (data && data.error) || "error";
      err.data = data || {};
      throw err;
    }
    return data;
  }

  // ===== 4. BARABAN CHIZISH VA AYLANTIRISH =====
  function buildBulbs() {
    bulbsLayer.innerHTML = "";
    const count = 16;
    for (let i = 0; i < count; i++) {
      const angle = (i * 2 * Math.PI) / count;
      const pct = 50 + 47.6 * Math.cos(angle);
      const topPct = 50 + 47.6 * Math.sin(angle);
      const b = document.createElement("span");
      b.className = "bulb";
      b.style.left = `${pct}%`;
      b.style.top = `${topPct}%`;
      bulbsLayer.appendChild(b);
    }
  }

  function startBulbChase() {
    stopBulbChase();
    let idx = 0;
    const bulbs = bulbsLayer.querySelectorAll(".bulb");
    if (!bulbs.length) return;
    bulbTimer = setInterval(() => {
      bulbs.forEach((b, i) => {
        b.classList.toggle("lit", (i + idx) % 2 === 0);
      });
      idx = (idx + 1) % bulbs.length;
    }, 110);
  }

  function stopBulbChase() {
    clearInterval(bulbTimer);
    bulbTimer = null;
    bulbsLayer.querySelectorAll(".bulb").forEach((b) => b.classList.remove("lit"));
  }

  function drawWheel() {
    const ctx = wheelCanvas.getContext("2d");
    const w = wheelCanvas.width;
    const h = wheelCanvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const r = Math.min(cx, cy) - 8;

    ctx.clearRect(0, 0, w, h);

    const list = state.prizes;
    const n = list.length;
    if (!n) return;

    const arc = (2 * Math.PI) / n;

    // 0-indeks tepadan (-PI/2) boshlanib, soat mili bo'yicha chiziladi
    for (let i = 0; i < n; i++) {
      const startAngle = -Math.PI / 2 + i * arc;
      const endAngle = startAngle + arc;
      const pair = PALETTE.sectors[i % PALETTE.sectors.length];

      const grad = ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
      grad.addColorStop(0, pair[0]);
      grad.addColorStop(1, pair[1]);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.stroke();

      // Sektor markazida ⭐ N yozuvi (aylanishga mos burilgan holda)
      ctx.save();
      const midAngle = startAngle + arc / 2;
      ctx.translate(cx + Math.cos(midAngle) * (r * 0.66), cy + Math.sin(midAngle) * (r * 0.66));
      ctx.rotate(midAngle + Math.PI / 2);
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0, 0, 0, 0.55)";
      ctx.shadowBlur = 6;
      ctx.fillText(`⭐ ${formatStarNum(list[i].prize)}`, 0, 0);
      ctx.restore();
    }

    // Tashqi halqa
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.stroke();
  }

  function applyWheelAngle(deg) {
    wheelCanvas.style.transform = `rotate(${deg}deg)`;
  }

  function getCurrentSectorAtPointer(deg) {
    const n = state.prizes.length;
    if (!n) return 0;
    const step = 360 / n;
    const norm = ((deg % 360) + 360) % 360;
    // Baraban deg gradus soat mili bo'yicha aylanganda tepada (0°) turgan nuqta barabanda (360 - norm)° da bo'ladi
    const underPointer = (360 - norm) % 360;
    return Math.floor(underPointer / step) % n;
  }

  function spinToSector(targetIndex) {
    return new Promise((resolve) => {
      const n = state.prizes.length;
      if (!n) return resolve();

      const idx = Math.max(0, Math.min(n - 1, Number(targetIndex) || 0));
      const step = 360 / n;
      const sectorCenter = idx * step + step / 2;
      // Markazdan +-30% ichida tasodifiy siljish (chegaraga tushmasin)
      const jitterRange = step * 0.3;
      const jitter = (Math.random() * 2 - 1) * jitterRange;
      const desiredMod = (((360 - (sectorCenter + jitter)) % 360) + 360) % 360;

      const currentMod = ((state.rotation % 360) + 360) % 360;
      let delta = desiredMod - currentMod;
      if (delta < 0) delta += 360;

      const fullTurns = Math.floor(Math.random() * 3) + 5; // 5–7 to'liq aylanish
      const startDeg = state.rotation;
      const finalDeg = startDeg + fullTurns * 360 + delta;
      const duration = 5000;
      const startTime = performance.now();

      state.spinning = true;
      wheelFrame.classList.add("spinning");
      startBulbChase();
      updateButtonsState();

      // cubic-bezier(0.12, 0.8, 0.2, 1) yaqinlashuvi
      function easeOutCustom(t) {
        return 1 - Math.pow(1 - t, 3.8);
      }

      function frame(now) {
        const elapsed = now - startTime;
        const p = Math.min(1, elapsed / duration);
        const curDeg = startDeg + (finalDeg - startDeg) * easeOutCustom(p);
        applyWheelAngle(curDeg);

        const secNow = getCurrentSectorAtPointer(curDeg);
        if (secNow !== state.lastTickSector) {
          state.lastTickSector = secNow;
          hapticImpact("light");
        }

        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          state.rotation = finalDeg;
          applyWheelAngle(state.rotation);
          state.spinning = false;
          wheelFrame.classList.remove("spinning");
          stopBulbChase();
          hapticNotify("success");
          updateButtonsState();
          resolve();
        }
      }

      requestAnimationFrame(frame);
    });
  }

  // ===== 5. KONFETTI (CANVAS, KUTUBXONASIZ) =====
  function launchConfetti() {
    const ctx = confettiCanvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    confettiCanvas.width = window.innerWidth * dpr;
    confettiCanvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const colors = ["#fde047", "#ec4899", "#06b6d4", "#a855f7", "#10b981"];
    const pieces = Array.from({ length: 85 }, () => ({
      x: Math.random() * window.innerWidth,
      y: -20 - Math.random() * 140,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 5,
      vy: 2.5 + Math.random() * 4,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      vRot: -0.12 + Math.random() * 0.24,
      color: colors[Math.floor(Math.random() * colors.length)]
    }));

    const start = performance.now();
    const maxMs = 2400;

    function tick(now) {
      const elapsed = now - start;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vRot;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (elapsed < maxMs) {
        requestAnimationFrame(tick);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    requestAnimationFrame(tick);
  }

  // ===== 6. EKRANNI YANGILASH =====
  function renderPrizesTable() {
    prizesGrid.innerHTML = "";
    for (const item of state.prizes) {
      const row = document.createElement("div");
      row.className = "prize-row";

      const left = document.createElement("span");
      left.textContent = `⭐ ${formatStarNum(item.prize)}`;

      const right = document.createElement("span");
      right.textContent = `👥 ${Number(item.need) || 0}`;

      row.appendChild(left);
      row.appendChild(right);
      prizesGrid.appendChild(row);
    }
  }

  function renderPendingCard() {
    const p = state.pending;
    if (!p) {
      pendingCard.classList.add("hidden");
      return;
    }
    pendingCard.classList.remove("hidden");
    const prizeNum = formatStarNum(p.prize);
    const needNum = Number(p.need) || 1;
    const haveNum = Number(p.have) || 0;
    const pct = Math.max(0, Math.min(100, Math.round((haveNum / needNum) * 100)));

    pendingTitleEl.textContent = `🎁 ${prizeNum} ⭐ sizniki!`;
    pendingSubEl.textContent = `Olish uchun ${needNum} ta do‘st taklif qiling`;
    progressTextEl.textContent = `${haveNum} / ${needNum}`;
    progressPctEl.textContent = `${pct}%`;
    progressFillEl.style.width = `${pct}%`;

    claimBtn.disabled = !p.ready || state.spinning || state.busy;
  }

  function updateButtonsState() {
    const locked = state.spinning || state.busy;

    centerSpinBtn.disabled = locked || !state.can_spin || !!state.pending || state.next_in > 0;

    if (state.pending) {
      mainSpinBtn.disabled = true;
      mainSpinBtn.textContent = "Avval sovrinni oling 👇";
    } else if (state.next_in > 0) {
      mainSpinBtn.disabled = true;
      mainSpinBtn.textContent = `⏳ ${formatHMS(state.next_in)}`;
    } else if (state.can_spin) {
      mainSpinBtn.disabled = locked;
      mainSpinBtn.textContent = "🎡 AYLANTIRISH";
    } else {
      mainSpinBtn.disabled = true;
      mainSpinBtn.textContent = "🎡 AYLANTIRISH";
    }

    inviteBtn.disabled = locked;
    copyRefBtn.disabled = locked;
    refreshBtn.disabled = locked;
    withdrawBtn.disabled = locked;
    if (state.pending) {
      claimBtn.disabled = locked || !state.pending.ready;
    }
  }

  function startCountdown() {
    clearInterval(countdownTimer);
    if (state.next_in <= 0) return;

    countdownTimer = setInterval(() => {
      if (state.next_in > 0) {
        state.next_in -= 1;
        updateButtonsState();
      }
      if (state.next_in <= 0) {
        clearInterval(countdownTimer);
        state.next_in = 0;
        loadState(true);
      }
    }, 1000);
  }

  function applyStatePayload(data) {
    state.balance = Number(data.balance) || 0;
    state.referred = Number(data.referred) || 0;
    state.prizes = Array.isArray(data.prizes) ? data.prizes : [];
    state.pending = data.pending || null;
    state.next_in = Math.max(0, Math.floor(Number(data.next_in) || 0));
    state.can_spin = Boolean(data.can_spin);
    state.min_withdraw = Number(data.min_withdraw) || 0;
    state.ref_link = String(data.ref_link || "");
    state.bot_username = String(data.bot_username || "");

    animateBalanceTo(state.balance);
    drawWheel();
    renderPendingCard();
    renderPrizesTable();
    withdrawNoteEl.textContent = `Minimal yechish: ${formatStarNum(state.min_withdraw)} ⭐, botdagi «💸 Stars yechish» bo‘limida`;
    updateButtonsState();
    startCountdown();
  }

  // ===== 7. XATOLAR VA GATE EKRANI =====
  function showGate({ title, desc, buttonText, onButton }) {
    loadingSkeleton.classList.add("hidden");
    mainApp.classList.add("hidden");
    gateScreen.classList.remove("hidden");

    gateTitle.textContent = title;
    gateDesc.textContent = desc;

    if (buttonText && typeof onButton === "function") {
      gateBtn.classList.remove("hidden");
      gateBtn.textContent = buttonText;
      gateBtn.onclick = onButton;
    } else {
      gateBtn.classList.add("hidden");
      gateBtn.onclick = null;
    }
  }

  function renderSubscribeBox(channels) {
    const list = Array.isArray(channels) ? channels : [];
    subscribeLinks.innerHTML = "";
    list.forEach((url, i) => {
      const safeUrl = String(url || "");
      const a = document.createElement("a");
      a.className = "btn";
      a.textContent = `📢 ${i + 1}-kanalga o‘tish`;
      a.href = safeUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.textDecoration = "none";
      subscribeLinks.appendChild(a);
    });
    subscribeCard.classList.remove("hidden");
  }

  function handleApiError(err, isInitial = false) {
    const code = err && err.code ? err.code : "error";
    const data = (err && err.data) || {};
    const msg = (err && err.message) || "Xatolik yuz berdi";

    if (code === "no_user") {
      showGate({
        title: "Foydalanuvchi topilmadi",
        desc: msg,
        buttonText: "Botga qaytib /start bosing",
        onButton: () => {
          if (tg && tg.close) tg.close();
        }
      });
      return;
    }

    if (code === "subscribe") {
      loadingSkeleton.classList.add("hidden");
      gateScreen.classList.add("hidden");
      mainApp.classList.remove("hidden");
      renderSubscribeBox(data.channels);
      showToast(msg);
      return;
    }

    if (code === "cooldown" && typeof data.next_in === "number") {
      state.next_in = Math.max(0, Math.floor(data.next_in));
      state.can_spin = false;
      updateButtonsState();
      startCountdown();
      showToast(msg);
      return;
    }

    if (isInitial) {
      showGate({
        title: "Internet bilan muammo",
        desc: msg,
        buttonText: "Qayta urinish",
        onButton: () => initApp()
      });
      return;
    }

    hapticNotify("error");
    showToast(msg);
  }

  // ===== 8. AMALLAR (/api/state, /api/spin, /api/claim) =====
  async function loadState(silent = false) {
    if (!silent && state.busy) return;
    if (!silent) {
      state.busy = true;
      updateButtonsState();
    }
    try {
      const data = await postApi("/api/state");
      subscribeCard.classList.add("hidden");
      loadingSkeleton.classList.add("hidden");
      gateScreen.classList.add("hidden");
      mainApp.classList.remove("hidden");
      applyStatePayload(data);
    } catch (err) {
      handleApiError(err, !state.prizes.length && !silent);
    } finally {
      if (!silent) {
        state.busy = false;
        updateButtonsState();
      }
    }
  }

  async function onSpinClick() {
    if (state.spinning || state.busy || !state.can_spin || state.pending || state.next_in > 0) return;
    state.busy = true;
    updateButtonsState();

    try {
      const res = await postApi("/api/spin");
      state.busy = false;
      await spinToSector(res.index);

      if (res.state) {
        applyStatePayload(res.state);
      } else {
        await loadState(true);
      }

      const wonPrize = formatStarNum(res.prize);
      const wonNeed = Number(res.need) || 0;
      winModalTitle.textContent = `🎉 Sizga ${wonPrize} ⭐ tushdi!`;
      winModalText.textContent = `Olish uchun ${wonNeed} ta do‘st taklif qiling`;
      winModal.classList.add("open");
      launchConfetti();
    } catch (err) {
      state.busy = false;
      updateButtonsState();
      handleApiError(err, false);
    }
  }

  async function onClaimClick() {
    if (state.spinning || state.busy || !state.pending || !state.pending.ready) return;
    state.busy = true;
    updateButtonsState();

    try {
      const res = await postApi("/api/claim");
      hapticNotify("success");
      launchConfetti();
      showToast(`✅ ${formatStarNum(res.prize)} ⭐ balansga qo‘shildi!`);
      if (res.state) {
        applyStatePayload(res.state);
      } else {
        await loadState(true);
      }
    } catch (err) {
      handleApiError(err, false);
    } finally {
      state.busy = false;
      updateButtonsState();
    }
  }

  function onInviteClick() {
    if (!state.ref_link) {
      showToast("Referal havola mavjud emas");
      return;
    }
    hapticImpact("light");
    const shareUrl =
      "https://t.me/share/url?url=" +
      encodeURIComponent(state.ref_link) +
      "&text=" +
      encodeURIComponent("🎡 Baraban aylantirib Stars yuting!");

    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(shareUrl);
    } else {
      window.open(shareUrl, "_blank", "noopener,noreferrer");
    }
  }

  async function onCopyRefClick() {
    if (!state.ref_link) return;
    hapticImpact("light");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(state.ref_link);
        showToast("Nusxalandi ✅");
        return;
      }
    } catch (_) {}

    const ta = document.createElement("textarea");
    ta.value = state.ref_link;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Nusxalandi ✅");
    } catch (_) {
      showToast("Nusxalab bo‘lmadi");
    }
    document.body.removeChild(ta);
  }

  // ===== 9. HODISALAR VA ISHGA TUSHIRISH =====
  mainSpinBtn.addEventListener("click", onSpinClick);
  centerSpinBtn.addEventListener("click", onSpinClick);
  claimBtn.addEventListener("click", onClaimClick);
  inviteBtn.addEventListener("click", onInviteClick);
  copyRefBtn.addEventListener("click", onCopyRefClick);
  refreshBtn.addEventListener("click", () => {
    hapticImpact("light");
    loadState(false);
  });
  checkSubBtn.addEventListener("click", () => {
    hapticImpact("light");
    loadState(false);
  });
  winModalClose.addEventListener("click", () => {
    hapticImpact("light");
    winModal.classList.remove("open");
  });
  winModal.addEventListener("click", (e) => {
    if (e.target === winModal) winModal.classList.remove("open");
  });
  withdrawBtn.addEventListener("click", () => {
    hapticImpact("light");
    if (tg && tg.close) tg.close();
  });

  function startAutoRefresh() {
    clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (!document.hidden && !state.spinning && !state.busy && !mainApp.classList.contains("hidden")) {
        loadState(true);
      }
    }, 20000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !state.spinning && !state.busy && !mainApp.classList.contains("hidden")) {
        loadState(true);
      }
    });
  }

  function initApp() {
    const initData = tg && tg.initData ? tg.initData : "";
    if (!initData) {
      showGate({
        title: "🎡 Baraban",
        desc: "Bu ilovani Telegram bot orqali oching"
      });
      return;
    }

    const firstName =
      tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name
        ? tg.initDataUnsafe.user.first_name
        : "Foydalanuvchi";
    userNameEl.textContent = firstName;

    loadingSkeleton.classList.remove("hidden");
    gateScreen.classList.add("hidden");
    mainApp.classList.add("hidden");

    buildBulbs();
    loadState(false);
    startAutoRefresh();
  }

  initApp();
})();
</script>
